<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#05090f" />
    <title>Moto SyXp — Sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0, #122944, #05090f 62%);
        color: #fff;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: 32px;
        border: 1px solid #735811;
        border-radius: 24px;
        background: #081525;
        color: #fff;
        text-align: center;
        box-shadow: 0 24px 70px #0008;
      }
      .mark {
        width: 86px;
        height: 86px;
        margin: auto;
        border-radius: 24px;
        background: #05090f url("/icons/moto-syxp-mark.svg") center/cover
          no-repeat;
      }
      .card h1 {
        margin: 18px 0 8px;
      }
      .card p {
        margin: 0 0 20px;
        color: #aab7c8;
      }
      .card button {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 13px;
        background: linear-gradient(135deg, #ffe04c, #f3a600);
        color: #05090f;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-label="Moto SyXp"></div>
      <h1>Sem conexão</h1>
      <p>
        O Moto SyXp não guarda dados privados para uso offline. Reconecte-se
        para sincronizar o estado real da sua corrida.
      </p>
      <button type="button" onclick="location.reload()">
        TENTAR NOVAMENTE
      </button>
    </main>
  </body>
</html>
