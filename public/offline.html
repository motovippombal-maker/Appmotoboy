<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071c39" />
    <title>Moto VIP — Sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#071c39;color:#fff;font:16px/1.5 system-ui,sans-serif}.card{width:min(420px,100%);padding:32px;border-radius:24px;background:#fff;color:#071c39;text-align:center;box-shadow:0 24px 70px #0004}.mark{width:72px;height:72px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#e51d3f;color:#fff;font-weight:900;font-size:24px}.card h1{margin:18px 0 8px}.card p{margin:0 0 20px;color:#607287}.card button{width:100%;height:50px;border:0;border-radius:13px;background:#0876f9;color:#fff;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">MV</div>
      <h1>Sem conexão</h1>
      <p>O Moto VIP não guarda dados privados para uso offline. Reconecte-se para sincronizar o estado real da sua corrida.</p>
      <button type="button" onclick="location.reload()">TENTAR NOVAMENTE</button>
    </main>
  </body>
</html>
